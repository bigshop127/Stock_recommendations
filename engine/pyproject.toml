[project]
name = "finance-engine"
version = "0.1.0"
description = "台股多因子量化 + 回測 + 多 agent 引擎（財經 APP 整合計畫）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
