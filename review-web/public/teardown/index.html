<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b0c">
<title>AI 硬體拆解台｜從原料到機櫃</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#070b0c;--bg2:#0c1213;--fg:#e7ecea;--mut:#95a29f;--dim:#5f6c69;
  --ac:#48d597;--acs:rgba(72,213,151,.1);--acb:rgba(72,213,151,.42);
  --hot:#f0a33c;--hots:rgba(240,163,60,.12);--hotb:rgba(240,163,60,.45);
  --my:#6cb6ff;--mys:rgba(108,182,255,.12);--myb:rgba(108,182,255,.5);
  --ln:rgba(231,240,237,.08);--ln2:rgba(231,240,237,.16);
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --sh:0px;
  color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--fg);font:14px/1.65 var(--sans);padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:1px solid var(--ac);outline-offset:2px}
a{color:var(--ac)}

/* header */
header{flex:none;border-bottom:1px solid var(--ln);position:relative;z-index:9;background:var(--bg)}
.top{display:flex;align-items:center;gap:12px;padding:10px 12px 8px 16px;min-width:0}
h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.04em;white-space:nowrap}
.kick{flex:1;min-width:0;font:500 10px var(--mono);letter-spacing:.16em;color:var(--dim);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{display:inline-flex;align-items:center;gap:6px;font:500 11px/1 var(--mono);letter-spacing:.04em;color:var(--mut);border:1px solid var(--ln2);border-radius:6px;padding:7px 9px;white-space:nowrap}
.ib svg{width:13px;height:13px}
.ib.on{color:var(--ac);border-color:var(--acb)}
#search{display:flex;gap:8px;padding:0 12px 10px 16px}
#search[hidden]{display:none}
#q{flex:1;min-width:0;background:var(--bg2);border:1px solid var(--ln2);border-radius:7px;padding:8px 11px;font-size:14px;outline:none}
#q:focus{border-color:var(--acb)}
#stages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:0 16px}
#stages button{position:relative;text-align:left;padding:7px 0 6px;border-top:2px solid var(--ln2);color:var(--dim);transition:color .25s,border-color .25s;min-width:0}
#stages b{font:500 10px var(--mono);letter-spacing:.06em;margin-right:5px}
#stages span{font-size:14px;font-weight:600}
#stages small{display:block;font-size:11px;line-height:1.4;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stages button.done{border-top-color:rgba(72,213,151,.3);color:var(--mut)}
#stages button.on{border-top-color:var(--ac);color:var(--fg)}
#stages button.on b{color:var(--ac)}
.dot{position:absolute;top:6px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--hot);color:#1a1004;font:600 10px/16px var(--mono);text-align:center}
#scenes{display:flex;gap:20px;padding:0 16px;overflow-x:auto;scrollbar-width:none}
#scenes::-webkit-scrollbar,#crumbs::-webkit-scrollbar{display:none}
#scenes button{position:relative;padding:6px 0 7px;font-size:13px;color:var(--mut);border-bottom:1px solid transparent;white-space:nowrap}
#scenes button.on{color:var(--fg);border-bottom-color:var(--fg)}
#scenes button.hit::after{content:"";position:absolute;top:6px;right:-8px;width:6px;height:6px;border-radius:50%;background:var(--hot)}
#scenes .flow{margin-left:auto;font:500 10px var(--mono);letter-spacing:.1em;color:var(--dim);align-self:center;white-space:nowrap}
#crumbs{display:flex;align-items:center;gap:4px;padding:6px 16px 8px;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--ln);font-size:12px}
#crumbs[hidden]{display:none}
#crumbs button{white-space:nowrap;color:var(--mut);padding:3px 6px;border-radius:5px}
#crumbs button:hover{color:var(--fg)}
#crumbs .sep{color:var(--dim);font-family:var(--mono)}
#crumbs .now{color:var(--fg);white-space:nowrap;padding:3px 6px}
#crumbs .bk{border:1px solid var(--ln2);font-family:var(--mono);font-size:11px}
#crumbs .flt{margin-left:auto;border:1px solid var(--hotb);color:var(--hot);background:var(--hots)}

/* stage */
#app{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
#stage{position:relative;flex:none;height:47vh;height:47svh;min-height:270px;overflow:hidden;border-bottom:1px solid var(--ln);background:radial-gradient(120% 85% at 50% 38%,#122023 0,#0a1112 55%,var(--bg) 100%);touch-action:none}
#stage canvas{position:absolute;inset:0;display:block}
#dims{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#dims line{stroke:var(--fg);stroke-width:1;opacity:.85}
#dims .tk{stroke:var(--fg);stroke-width:1}
#dims text{font:500 11px var(--mono);fill:var(--fg);paint-order:stroke;stroke:#070b0c;stroke-width:4px;stroke-linejoin:round}
#mks{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.mk{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;pointer-events:auto;cursor:pointer;will-change:transform;transition:opacity .25s}
.mk i{position:relative;font:500 10px/1 var(--mono);font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--fg);background:rgba(8,12,13,.82);border:1px solid var(--ln2);flex:none;transition:background .2s,color .2s}
.mk.hot i::after{content:"";position:absolute;top:-2px;right:-2px;width:7px;height:7px;border-radius:50%;background:var(--hot);border:1.5px solid #0b1112}
.mk span{display:none;font-size:11.5px;line-height:1;padding:5px 8px;border-radius:4px;background:rgba(8,12,13,.84);border:1px solid var(--ln2);white-space:nowrap}
.names .mk span{display:block}
.mk.on{z-index:2}.mk.on i{background:var(--ac);border-color:var(--ac);color:#03140c}
.mk.on span{display:block;border-color:var(--acb)}
.mk.hit i{box-shadow:0 0 0 2px var(--hot)}
.mk.dim{opacity:.35}
#fx{position:absolute;inset:0;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .28s ease;z-index:4}
.hud{position:absolute;display:flex;gap:6px;align-items:center;z-index:5}
.tl{top:10px;left:14px;flex-direction:column;align-items:flex-start;gap:1px;pointer-events:none;max-width:45%}
.fig{font:500 10px var(--mono);letter-spacing:.16em;color:var(--dim)}
.fig2{font:500 11px var(--mono);letter-spacing:.06em;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tr{top:8px;right:10px;flex-wrap:wrap;justify-content:flex-end;max-width:58%}
.bot{left:0;right:0;bottom:var(--sh);padding:18px 10px 10px;background:linear-gradient(rgba(7,11,12,0),rgba(7,11,12,.85))}
.hb{font:500 11px/1 var(--mono);letter-spacing:.04em;color:var(--mut);background:rgba(10,15,16,.74);border:1px solid var(--ln);border-radius:6px;padding:7px 9px;white-space:nowrap;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.hb.on{color:var(--ac);border-color:var(--acb)}
[hidden]{display:none!important}
.seg{display:flex;border:1px solid var(--ln);border-radius:6px;overflow:hidden;background:rgba(10,15,16,.74)}
.seg button{font:500 11px/1 var(--mono);color:var(--mut);padding:7px 9px}
.seg button.on{color:#03140c;background:var(--ac)}
.ex{flex:1;display:flex;align-items:center;gap:8px;min-width:0;max-width:460px;margin-right:auto}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:50px;height:26px;margin:0;background:transparent;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:2px;border-radius:2px;background:linear-gradient(90deg,var(--ac) var(--p),rgba(231,240,237,.2) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-7px;border-radius:50%;background:var(--fg);border:4px solid #0b1112;box-shadow:0 0 0 1px var(--ac)}
input[type=range]::-moz-range-track{height:2px;background:rgba(231,240,237,.2)}
input[type=range]::-moz-range-progress{height:2px;background:var(--ac)}
input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--fg);border:3px solid #0b1112;box-shadow:0 0 0 1px var(--ac)}
#results{position:absolute;left:0;right:0;top:0;max-height:62%;overflow-y:auto;background:rgba(9,14,15,.97);border-bottom:1px solid var(--ln2);z-index:8;padding:6px 16px 14px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.rco{padding:10px 0;border-bottom:1px solid var(--ln)}
.rh{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font-weight:600}
.rh small{font-weight:400;color:var(--dim);margin-left:auto;font-size:11.5px}
.rp{display:block;width:100%;text-align:left;font-size:13px;color:var(--mut);padding:4px 0 4px 12px;border-left:1px solid var(--ln2);margin-top:4px}
.rp:hover{color:var(--fg);border-left-color:var(--ac)}
/* 審視網連動：搜尋結果裡的收盤價、所屬資料夾、開個股頁、加入資料夾；「我的公司」模式改用藍色標亮 */
.rx{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0 2px}
.rx .q{font:500 11px var(--mono);color:var(--mut);margin-right:2px}
.rx .fl{font-size:11px;line-height:1;color:var(--my);border:1px solid var(--myb);border-radius:3px;padding:3px 6px}
.lk{font-size:12px;color:var(--ac);border:1px solid var(--acb);border-radius:5px;padding:3px 9px;white-space:nowrap}
.lk:hover{background:var(--acs)}
.lk:disabled{opacity:.5;pointer-events:none}
.addf{display:inline-flex;gap:4px;align-items:center}
.addf select{max-width:150px;background:var(--bg2);border:1px solid var(--ln2);border-radius:5px;padding:3px 6px;font:inherit;font-size:12px;color:var(--fg)}
.myh{margin:6px 0 2px;font-size:12px;color:var(--mut)}
.myh b{color:var(--my);font-weight:600}
.my-on .dot{background:var(--my);color:#04121f}
.my-on #scenes button.hit::after{background:var(--my)}
.my-on .mk.hit i{box-shadow:0 0 0 2px var(--my)}
.my-on #plist button.hit{box-shadow:inset 0 0 0 1px var(--myb)}
#crumbs .flt.my{border-color:var(--myb);color:var(--my);background:var(--mys)}
.ib.my.on{color:var(--my);border-color:var(--myb)}
.ib[hidden]{display:none}
.empty{color:var(--dim);font-size:13px;padding:12px 0}

/* panel */
#pn{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
#grab{display:none}
#sh{flex:none;display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--ln)}
#sh .nv{width:34px;height:34px;border:1px solid var(--ln2);border-radius:7px;font:500 14px var(--mono);color:var(--mut);flex:none}
#sht{flex:1;min-width:0;text-align:center;line-height:1.3}
#sht b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sht small{font:500 10px var(--mono);letter-spacing:.12em;color:var(--dim)}
#body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px 16px calc(28px + env(safe-area-inset-bottom))}
.lab{font:500 10px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
#tour{border:1px solid var(--acb);background:var(--acs);border-radius:8px;padding:10px 12px;margin-bottom:14px}
#tour .lab{color:var(--ac)}
#tour p{margin:4px 0 10px;font-size:13.5px}
.row{display:flex;gap:8px;flex-wrap:wrap}
#plist{display:flex;gap:6px;overflow-x:auto;padding:8px 16px 14px;margin:0 -16px;scrollbar-width:none;border-bottom:1px solid var(--ln)}
#plist::-webkit-scrollbar{display:none}
#plist button{flex:none;position:relative;display:flex;gap:7px;align-items:center;padding:6px 10px;border:1px solid var(--ln2);border-radius:6px;font-size:12.5px;color:var(--mut);white-space:nowrap;transition:border-color .2s,color .2s}
#plist button b{font:500 10px var(--mono);color:var(--dim)}
#plist button.on{border-color:var(--ac);color:var(--fg);background:var(--acs)}
#plist button.on b{color:var(--ac)}
#plist button.hit{box-shadow:inset 0 0 0 1px var(--hotb)}
#plist button.hot::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--hot)}
#info{padding-top:14px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font:500 10.5px/1 var(--mono);letter-spacing:.04em;color:var(--ac);border:1px solid var(--acb);border-radius:3px;padding:4px 6px;white-space:nowrap}
.tag.hot{color:var(--hot);border-color:var(--hotb);background:var(--hots)}
#nm{margin:10px 0 2px;font-size:21px;line-height:1.3;font-weight:600;letter-spacing:.01em}
.en{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
#ds{margin:12px 0 4px;color:#c9d2d0}
dl{margin:14px 0 0;border-top:1px solid var(--ln)}
dl>div{padding:10px 0;border-bottom:1px solid var(--ln)}
dt{font:500 10px/1.5 var(--mono);letter-spacing:.12em;color:var(--dim);margin-bottom:4px}
dt small{letter-spacing:.02em;font-family:var(--sans);font-size:10.5px;margin-left:4px}
dd{margin:0;font-size:13.5px}
.hotbox{border:1px solid var(--hotb);background:var(--hots);border-radius:8px;padding:10px 12px;margin-top:14px;font-size:13.5px}
.hotbox .lab{color:var(--hot)}
.hotbox p{margin:4px 0 6px}
.src{font-size:11.5px;color:var(--mut);line-height:1.5}
.src a{color:var(--mut);text-decoration-color:var(--ln2)}
.kd{display:grid;grid-template-columns:auto 1fr;gap:3px 14px}
.kd span{color:var(--mut);font-size:12.5px;white-space:nowrap}
.kd em{font-style:normal}
.kd sup a{font:500 9.5px var(--mono);text-decoration:none;margin-left:3px}
.cog{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}
.cgl{font-size:11.5px;color:var(--dim);margin-right:2px}
.co{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--ln2);border-radius:5px;padding:3px 8px;font-size:12.5px}
.co b{font:500 10.5px var(--mono);color:var(--ac)}
/* 審視網連動：存在資料夾的公司＝藍點、我的持股＝實心藍；旁邊是收盤價／本益比 */
.co.mine{border-color:var(--myb)}
.co.mine::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--my)}
.co.own{border-color:var(--my);background:var(--mys)}
.co.own::before{content:"持股";width:auto;height:auto;border-radius:3px;padding:2px 4px;font:600 9.5px/1 var(--sans);color:#04121f}
.co em{font:500 10.5px var(--mono);font-style:normal;color:var(--mut)}
.co:hover,.co.on{border-color:var(--hotb);background:var(--hots)}
.nav{display:grid;gap:8px;margin-top:16px}
.btn{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--ln2);border-radius:7px;padding:9px 12px;font-size:13px;transition:border-color .2s,background .2s}
.btn i{font:500 10.5px var(--mono);font-style:normal;letter-spacing:.08em;color:var(--dim);white-space:nowrap}
.btn.fw{border-color:var(--acb);background:var(--acs)}.btn.fw i{color:var(--ac)}
.btn.sm{width:auto;padding:7px 11px;font-size:12px}
.btn:hover{border-color:var(--ac)}
.btn:disabled{opacity:.35;pointer-events:none}
.hint{font-size:12.5px;color:var(--mut);margin:10px 0 0}
.foot{font-size:11.5px;color:var(--dim);margin-top:18px;line-height:1.6}
.err{position:absolute;inset:auto 16px 50% 16px;text-align:center;color:var(--mut);font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media(max-width:759px){
  #stage{position:absolute;inset:0;height:auto;min-height:0;border:0}
  #pn{position:absolute;left:0;right:0;bottom:0;height:var(--sh);z-index:6;border-top:1px solid var(--ln2);border-radius:14px 14px 0 0;box-shadow:0 -12px 30px rgba(0,0,0,.5);transition:height .32s cubic-bezier(.2,.8,.2,1)}
  #pn.drag{transition:none}
  #grab{display:grid;flex:none;height:20px;place-items:center;touch-action:none;cursor:grab}
  #grab span{width:38px;height:4px;border-radius:2px;background:var(--ln2)}
  #sh{touch-action:none;padding-top:2px}
  .bot{transition:bottom .32s cubic-bezier(.2,.8,.2,1)}
  #app.drag .bot{transition:none}
  #app.sheet-full .hud,#app.sheet-full #mks,#app.sheet-full #dims{visibility:hidden}
}
@media(min-width:760px){
  .top{padding:12px 20px 10px 24px}
  #search{padding:0 20px 10px 24px}
  #stages{padding:0 24px;max-width:780px}
  #scenes,#crumbs{padding-left:24px;padding-right:24px}
  #app{flex-direction:row}
  #stage{flex:1;height:auto;border-bottom:0}
  #pn{flex:none;width:400px;border-left:1px solid var(--ln)}
  #body{padding:14px 24px 32px}
  #plist{flex-wrap:wrap;overflow:visible;margin:0;padding:10px 0 16px}
  #results{left:auto;width:420px;max-height:70%;border-left:1px solid var(--ln2)}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header>
 <div class="top">
  <h1>AI 硬體拆解台</h1><span class="kick">AI Supply Chain · Teardown</span>
  <button class="ib" id="tu" aria-pressed="false">導覽</button>
  <!-- 審視網連動：外層頁面傳資料夾進來才顯示 -->
  <button class="ib my" id="my" aria-pressed="false" title="標亮你在審視網資料夾裡存過的公司" hidden>我的公司</button>
  <button class="ib" id="sbtn" aria-label="搜尋廠商" aria-expanded="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>廠商</button>
 </div>
 <div id="search" hidden><input id="q" type="search" placeholder="搜尋廠商、台股代號或零件，例如：台光電、2330、HBM" autocomplete="off" aria-label="搜尋廠商、代號或零件"><button class="ib" id="qx">關閉</button></div>
 <nav id="stages" aria-label="產業鏈階段"></nav>
 <nav id="scenes" aria-label="場景"></nav>
 <nav id="crumbs" aria-label="拆解路徑" hidden></nav>
</header>
<div id="app">
 <section id="stage" aria-label="3D 檢視">
  <svg id="dims" aria-hidden="true"></svg>
  <div id="mks"></div>
  <div id="fx"></div>
  <div class="hud tl"><span class="fig" id="fg1"></span><span class="fig2" id="fg2"></span></div>
  <div class="hud tr">
   <button class="hb" id="rl" hidden aria-pressed="false">真實比例</button>
   <button class="hb" id="dm" aria-pressed="false">尺寸</button>
   <button class="hb on" id="xr" aria-pressed="true">X 光</button>
   <button class="hb" id="rv">重設</button>
  </div>
  <div class="hud bot">
   <div class="ex" id="exw">
    <div class="seg" id="mx" hidden><button data-m="ex" class="on">展開</button><button data-m="sec">剖面</button></div>
    <button class="hb" id="bx">展開</button>
    <input id="sl" type="range" min="0" max="1" step=".01" value="0" aria-label="展開程度">
   </div>
   <button class="hb on" id="ar" aria-pressed="true">旋轉</button><button class="hb" id="bl" aria-pressed="false">標籤</button>
  </div>
  <div id="results" hidden></div>
 </section>

  box.hidden = false; resMode = exactKey || '*';
  bindResults(box);
}
// 審視網連動：結果卡的綁定拆出來，「我的公司」清單共用；多了開個股頁、加入資料夾兩種按鈕
function bindResults(box) {
  $$('[data-stock]', box).forEach(b => { b.onclick = () => openStock(b.dataset.stock); });
  $$('[data-add]', box).forEach(b => {
    b.onclick = () => {
      const c = b.dataset.add, pickEl = b.previousElementSibling;
      toParent({ type: 'teardown:add', code: CO[c].tw, name: c, folder: pickEl.value });
      b.disabled = true; b.textContent = '加入中…';
    };
  });
  $$('.rh[data-co]', box).forEach(b => { b.onclick = () => { setFocus(b.dataset.co); renderResults(b.dataset.co); }; });
  $$('.rp', box).forEach(b => {
    b.onclick = () => {
      if (b.dataset.co) setFocus(b.dataset.co);
      box.hidden = true; if (MOBILE) closeSearch();
      const sk = b.dataset.sc, id = b.dataset.id || null;
      stopTour(); if (sk === cur) pick(id); else { hist.push([cur, sel]); nav(sk, id, 'fade'); }
    };
  });
}
function setFocus(c) { focusCo = c; refreshHits(); crumbs(); if (sel) show(parts.find(p => p.id === sel)); else show(null); }
function refreshHits() {
  // 審視網連動：單一廠商標亮優先；沒有的話「我的公司」模式標出所有存過的公司，階段上的數字改成「幾家」
  const useMy = !focusCo && myOn;
  document.body.classList.toggle('my-on', useMy);
  const list = focusCo ? (INDEX[focusCo] || []) : useMy ? myKeys().flatMap(c => INDEX[c]) : [];
  const stg = {}, scs = new Set(), ids = new Set();
  list.forEach(([sk, id]) => { stg[SCN[sk].st] = (stg[SCN[sk].st] || 0) + 1; scs.add(sk); if (id) ids.add(id); });
  if (useMy) {
    const per = {};
    for (const c of myKeys()) for (const [sk] of INDEX[c]) (per[SCN[sk].st] = per[SCN[sk].st] || new Set()).add(c);
    for (const k in per) stg[k] = per[k].size;
  }
  $$('#stages button').forEach(b => { b.querySelector('.dot')?.remove(); if (stg[b.dataset.k]) b.insertAdjacentHTML('beforeend', `<span class="dot">${stg[b.dataset.k]}</span>`); });
  $$('#scenes button').forEach(b => b.classList.toggle('hit', scs.has(b.dataset.k)));
  parts.forEach(p => { p.el.classList.toggle('hit', ids.has(p.id)); p.chip.classList.toggle('hit', ids.has(p.id)); });
}

// 手機抽屜
function snaps() { const H = APP.clientHeight; return { peek: 78, half: Math.round(H * 0.48), full: Math.max(200, H - 56) }; }
function setSheet(state, h) {
  if (!MOBILE) { sheetH = 0; APP.style.setProperty('--sh', '0px'); APP.classList.remove('sheet-full'); applyOffset(); return; }
  sheetState = state || sheetState;
  sheetH = h ?? snaps()[sheetState];
  APP.style.setProperty('--sh', sheetH + 'px');
  APP.classList.toggle('sheet-full', sheetH > APP.clientHeight * 0.72);
  applyOffset();
}
function applyOffset() {
  const w = STAGE.clientWidth, h = STAGE.clientHeight;
  if (!w || !h) return;
  if (sheetH > 0) C.setViewOffset(w, h, 0, sheetH / 2, w, h); else C.clearViewOffset();
  C.updateProjectionMatrix(); invalidate();
}
{
  let d = null;
  const start = e => {
    if (!MOBILE || e.target.closest('.nv')) return;
    d = { y: e.clientY, h: sheetH, t: performance.now(), moved: false };
    PN.classList.add('drag'); APP.classList.add('drag');
    e.currentTarget.setPointerCapture?.(e.pointerId);
  };
  const move = e => {
    if (!d) return;
    const dy = e.clientY - d.y; if (Math.abs(dy) > 4) d.moved = true;
    const s = snaps(); setSheet(null, Math.max(s.peek, Math.min(s.full, d.h - dy)));
  };
  const end = e => {
    if (!d) return;
    PN.classList.remove('drag'); APP.classList.remove('drag');
    const s = snaps(), v = (e.clientY - d.y) / Math.max(1, performance.now() - d.t);
    let st;
    if (!d.moved) st = sheetState === 'peek' ? 'half' : sheetState;
    else if (v < -0.5) st = sheetH > s.half ? 'full' : 'half';
    else if (v > 0.5) st = sheetH < s.half ? 'peek' : 'half';
    else st = Object.entries(s).sort((a, b) => Math.abs(a[1] - sheetH) - Math.abs(b[1] - sheetH))[0][0];
    d = null; setSheet(st);
    setTimeout(refit, 340);
  };
  for (const el of [$('#grab'), $('#sh')]) { el.addEventListener('pointerdown', start); el.addEventListener('pointermove', move); el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end); }
}
function refit() {
  if (!cur) return;
  if (sel) { const p = parts.find(q => q.id === sel); if (p) { follow = false; tweenTo(partView(p), 450, () => { follow = true; }); } }
  else tweenTo(sceneView(true), 450);
}
// 說明區左右滑：切換零件
{
  let s = null;
  $('#body').addEventListener('touchstart', e => { if (e.target.closest('#plist,input,a')) { s = null; return; } const t = e.touches[0]; s = { x: t.clientX, y: t.clientY }; }, { passive: true });
  $('#body').addEventListener('touchend', e => {
    if (!s) return; const t = e.changedTouches[0], dx = t.clientX - s.x, dy = t.clientY - s.y; s = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 2) stepPart(dx < 0 ? 1 : -1);
  }, { passive: true });
}

// 綁定按鈕
stageBtns();
$('#sl').oninput = e => {
  const v = +e.target.value; setSl(v); clearTimeout(tmEx);
  if (mode === 'ex') exT = v; else secT = v;
  invalidate();
};
$$('#mx button').forEach(b => { b.onclick = () => { setMode(b.dataset.m); invalidate(); }; });
$('#bx').onclick = () => { exT = exT > 0.5 ? 0 : 1; setSl(exT); clearTimeout(tmEx); invalidate(); };
$('#ar').onclick = () => setRot(!rotOn);
$('#bl').onclick = () => { names = !names; mks.classList.toggle('names', names); tog($('#bl'), names); invalidate(); };
$('#xr').onclick = () => { xray = !xray; tog($('#xr'), xray); parts.forEach(p => { p.gT = sel && xray && p.id !== sel ? 1 : 0; }); invalidate(); };
$('#dm').onclick = () => { dimsOn = !dimsOn; tog($('#dm'), dimsOn); invalidate(); };
$('#rv').onclick = () => { follow = false; tweenTo(sel ? partView(parts.find(p => p.id === sel)) : sceneView(false), 600, () => { follow = !!sel; }); };
$('#rl').onclick = () => { scT = scT ? 0 : 1; const b = $('#rl'); tog(b, scT); b.textContent = scT ? `真實比例・${LAYOUT[cur].rl}` : '真實比例'; invalidate(); };
$('#tu').onclick = () => (ti < 0 ? step_(0) : stopTour());
$('#my').onclick = () => setMy(!myOn);  // 審視網連動
$('#tp').onclick = () => step_(ti - 1); $('#tx').onclick = () => step_(ti + 1); $('#tq').onclick = stopTour;
$('#pv').onclick = () => stepPart(-1); $('#nx').onclick = () => stepPart(1);
$('#sbtn').onclick = () => ($('#search').hidden ? openSearch('', false) : closeSearch());
$('#qx').onclick = closeSearch;
$('#q').addEventListener('input', () => renderResults(null));
OC.addEventListener('start', () => { tw = null; follow = false; if (rotOn) setRot(false); });
OC.addEventListener('change', invalidate);
['pointerdown', 'wheel', 'keydown', 'touchstart'].forEach(ev => addEventListener(ev, () => { lastInput = performance.now(); }, { passive: true, capture: true }));
addEventListener('keydown', e => {
  if (e.target.closest('input')) { if (e.key === 'Escape') closeSearch(); return; }
  if (e.key === 'ArrowRight') { stepPart(1); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { stepPart(-1); e.preventDefault(); }
  else if (e.key === 'Escape') { if (!$('#search').hidden) closeSearch(); else if (sel) pick(null); }
});
// 點 3D 畫面選零件
{
  const rc = new T.Raycaster(), ptr = new T.Vector2(); let dn = null;
  R.domElement.addEventListener('pointerdown', e => { dn = [e.clientX, e.clientY]; });
  R.domElement.addEventListener('pointerup', e => {
    if (!dn || Math.hypot(e.clientX - dn[0], e.clientY - dn[1]) > 6) { dn = null; return; }
    dn = null;
    const r = R.domElement.getBoundingClientRect();
    ptr.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
    rc.setFromCamera(ptr, C);
    const h = rc.intersectObjects(root.children, true).find(i => {
      const p = parts.find(q => q.id === i.object.userData.pid);
      if (!p || (p.fade && ex > 0.3) || p.g > 0.5) return false;
      if (secS > 0.002 && secPlane.distanceToPoint(i.point) < 0) return false;
      return true;
    });
    if (!$('#results').hidden) { $('#results').hidden = true; return; }
    stopTour(); pick(h ? h.object.userData.pid : null);
  });
}
// 尺寸改變
function rs() {
  const w = STAGE.clientWidth, h = STAGE.clientHeight;
  if (!w || !h) return;
  R.setSize(w, h); C.aspect = w / h;
  dimsSvg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  setSheet(null);
  if (!cur) return;
  if (LAYOUT[cur].type === 'line' && colsFor(parts.length) !== cols) { load(cur, sel, null); return; }
  if (!tw) { if (sel) { const p = parts.find(q => q.id === sel); if (p) setView(partView(p)); } else setView(sceneView(true)); }
  invalidate();
}
mqMobile.addEventListener?.('change', e => { MOBILE = e.matches; setSheet(MOBILE ? 'half' : null); rs(); });
new ResizeObserver(rs).observe(STAGE);
setSheet('half');
rs();
{
  const [a, b] = decodeURIComponent(location.hash.slice(1)).split('/');
  // 審視網連動：個股頁的「AI 產業鏈」標籤會帶 ?co=代號：網址沒指定場景時，跳到這家公司第一次出現的地方並標亮
  const qc = new URLSearchParams(location.search).get('co'), ck = qc ? TW2CO[qc] || (CO[qc] ? qc : null) : null;
  const first = ck && !SCN[a] && INDEX[ck] ? INDEX[ck][0] : null;
  if (first) load(first[0], first[1], null); else load(SCN[a] ? a : 'rack', b, null);
  if (ck) openSearch(ck, true);
}
// 審視網連動：收外層的資料夾與收盤價，載入好就打招呼
addEventListener('message', e => {
  if (e.origin !== location.origin || e.source !== parent || !e.data) return;
  if (e.data.type === 'teardown:folders') applyFolders(e.data.folders, e.data.stocks);
  else if (e.data.type === 'teardown:quotes') { QUOTE = e.data.quotes || {}; rerender(); }

toParent({ type: 'teardown:ready' });
