# Puhui Daily Summary — 浦惠每日摘要自動化
name: Puhui Daily Summary

on:
  # 2026-05-25 暫停雲端排程：
  # - Gemini free-tier flash-lite quota 改為 limit=0，3 把 key 全失效
  # - 本機 puhui_daily.cjs 已改為 Claude CLI 主（吃 Pro 訂閱、無 quota）+ Gemini fallback
  # - 雲端沒法用 Claude CLI（需要登入態），所以雲端排程目前無法穩定產報告
  # - 改靠本機 Task Scheduler `PuhuiDaily_Summary`（週一～五 13:00）
  # 若日後升級 Gemini 付費 tier 或補上 Anthropic / OpenAI API key，再恢復下行 schedule
  # schedule:
  #   - cron: '0 5 * * 1-5'  # 05:00 UTC = 13:00 Taiwan (Mon-Fri)
  workflow_dispatch:
    inputs:
      date:
        description: '指定日期 YYYY-MM-DD（空白=今天）'
        required: false
        default: ''
      url:
        description: '指定文章 URL（空白=自動抓取）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Decode PressPlay cookies
        env:
          PRESSPLAY_COOKIES: ${{ secrets.PRESSPLAY_COOKIES }}
        run: |
          mkdir -p data
          echo "$PRESSPLAY_COOKIES" | base64 -d > data/pressplay_cookies.json
          echo "Cookies decoded: $(wc -c < data/pressplay_cookies.json) bytes"

      - name: Run daily summary
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          CI: 'true'
        run: node scripts/puhui_daily.cjs "${{ github.event.inputs.date }}" "${{ github.event.inputs.url }}"

      - name: Commit and push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --staged --quiet; then
            echo "No new report to commit"
          else
            git commit -m "report: $(date -u +%Y-%m-%d)"
            git push
          fi
